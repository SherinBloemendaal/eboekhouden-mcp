<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon from 64 px up: a ledger page with three rows and a total, and the green MCP plug.
       app-small.svg is the same picture simplified for 16 and 32 px. scripts/build-icons.sh renders both. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B86FF"/>
      <stop offset="0.55" stop-color="#2F5AE6"/>
      <stop offset="1" stop-color="#1D36A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EBFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43DE8E"/>
      <stop offset="1" stop-color="#16A862"/>
    </linearGradient>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#body)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
  <rect x="236" y="196" width="440" height="580" rx="64" fill="url(#page)" filter="url(#lift)"/>
  <g fill="#ADC0F6">
    <rect x="300" y="290" width="150" height="46" rx="23"/>
    <rect x="300" y="400" width="110" height="46" rx="23"/>
    <rect x="300" y="510" width="170" height="46" rx="23"/>
  </g>
  <g fill="#5A7EE8">
    <rect x="522" y="290" width="90" height="46" rx="23"/>
    <rect x="502" y="400" width="110" height="46" rx="23"/>
    <rect x="542" y="510" width="70" height="46" rx="23"/>
  </g>
  <rect x="300" y="626" width="312" height="20" rx="10" fill="#1F45C9"/>
  <g filter="url(#lift)">
    <circle cx="704" cy="704" r="168" fill="#2850D8"/>
    <circle cx="704" cy="704" r="150" fill="url(#green)"/>
  </g>
  <g transform="translate(704 704)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-30 -78v40M30 -78v40M0 48v40" stroke-width="30"/>
    <path d="M-62 -38h124v24a62 62 0 0 1-124 0z" fill="#FFFFFF" stroke-width="16"/>
  </g>
</svg>
