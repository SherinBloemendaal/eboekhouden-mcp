[package]
name = "eb-mcp"
version = "0.1.0"
description = "e-Boekhouden as a local, read-only MCP server"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "eb_mcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8.9"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
rand = "0.9"
keyring = "4.2.0"
log = "0.4"
tauri-plugin-log = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
