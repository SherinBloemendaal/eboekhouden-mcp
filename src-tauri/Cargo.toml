[package]
name = "eb-mcp"
version = "0.2.0"
description = "e-Boekhouden as a local, read-only MCP server"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]
members = [".", "bridge"]

[lib]
name = "eb_mcp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8.9"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1"
rand = "0.9"
keyring = "4.2.0"
log = "0.4"
tauri-plugin-log = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
url = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-opener = "2.7.2"
toml_edit = "0.25.19"
base64 = "0.22"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The WebSocket to e-Boekhouden's hub for "Facturen maken" (hub.rs); the TLS and the upgrade are reqwest's.
tokio-tungstenite = { version = "0.28", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Touch ID (creds.rs) and Sparkle, the macOS updater (updates.rs).
objc2 = "0.6.5"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSBundle"] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
